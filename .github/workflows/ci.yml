name: CI Pipeline

on:
  push:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-22.04  # Changed from ubuntu-latest to a stable version
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'  # Changed from 3.9 to 3.10

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run PyTest
        run: pytest